<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
 <meta content="width=device-width, initial-scale=1.0" name="viewport">
 <title>Data Validation | Unified P&L AI</title>
 <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
 <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
 <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
 <script>
 tailwind.config = {
 theme: {
 extend: {
 colors: {
 primary: '#5b5ceb',
 'primary-container': '#e5e6ff',
 'on-primary-container': '#1a1a4b',
 surface: '#f8f9fd',
 'surface-container-lowest': '#ffffff',
 'surface-container-low': '#f2f3f7',
 'on-surface': '#1a1c1e',
 'on-surface-variant': '#44474e',
 'outline-variant': '#c4c6d0',
 success: '#10b981',
 danger: '#ef4444',
 warning: '#f59e0b',
 },
 fontFamily: {
 sans: ['Inter', 'sans-serif'],
 },
 borderRadius: {
 'card': '20px',
 }
 }
 }
 }
 </script>
 <style data-purpose="custom-layout">
 body {
 background-color: #FAFBFF;
 font-family: 'Inter', sans-serif;
 }
 .custom-scrollbar::-webkit-scrollbar {
 width: 4px;
 }
 .custom-scrollbar::-webkit-scrollbar-thumb {
 background: #e2e8f0;
 border-radius: 10px;
 }
 .glass-effect {
 background: rgba(255, 255, 255, 0.8);
 backdrop-filter: blur(12px);
 }
 .sidebar-active {
 background-color: #e5e6ff;
 color: #5b5ceb;
 font-weight: 600;
 }
 .progress-ring-circle {
 transition: stroke-dashoffset 0.35s;
 transform: rotate(-90deg);
 transform-origin: 50% 50%;
 }
 </style>
    <link rel="stylesheet" href="css/sidebar.css">
</head>
<body class="text-on-surface transition-colors duration-300">
 <!-- Synchronous auth guard: prevents flash of unauthenticated content -->
 <script>
 (function() {
 var token = sessionStorage.getItem('pl_access_token') || localStorage.getItem('pl_access_token');
 if (!token) { window.location.replace('login.html'); }
 })();
 </script>


 <div id="sidebar-container"></div>


 <!-- BEGIN: Main Content Area -->
 <main class="ml-[280px] min-h-screen pb-16">
 <!-- BEGIN: Top Bar -->
 <header class="h-16 glass-effect border-b border-outline-variant/20 flex items-center justify-between px-8 sticky top-0 z-40">
 <div class="flex items-center gap-2">
 <span class="text-on-surface-variant text-sm">Home</span>
 <span class="material-symbols-outlined text-sm text-on-surface-variant">chevron_right</span>
 <span class="font-semibold text-sm">Dashboard</span>
 </div>
 <div class="flex-1 max-w-xl px-12">
 <div class="relative group">
 <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
 <input class="w-full bg-surface-container-low border-none rounded-full pl-10 pr-4 py-2 text-sm focus:ring-2 focus:ring-primary/20 transition-all" ="Search anything..." type="text">
 </div>
 </div>
 <div class="flex items-center gap-4">
 <button id="notifications-trigger" class="relative p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors">
 <span class="material-symbols-outlined">notifications</span>
 <span id="notifications-badge" class="absolute top-2 right-2 w-2 h-2 bg-danger rounded-full border-2 border-white" style="display:none"></span>
 </button>
 <button class="p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors">
 <span class="material-symbols-outlined">help</span>
 </button>
 </div>
 </header>
 <!-- END: Top Bar -->

 <div class="px-8 space-y-8 mt-8">
 <div style="max-width: 1000px; margin: 0 auto;">
 
 <div style="margin-bottom: var(--space-6); display: flex; justify-content: space-between; align-items: flex-end;">
 <div>
 <h1 class="text-h1 mb-2">Quality Validation</h1>
 <p class="text-body text-secondary">Checking ingested data against standard accounting and AI constraints.</p>
 </div>
 
 <div style="display: flex; gap: var(--space-3);">
 <button class="btn btn--secondary" id="btn-rerun" onclick="runValidation()">
 <span class="material-symbols-outlined">refresh</span> Re-run Rules
 </button>
 <button class="btn btn--primary" id="btn-continue" onclick="completePipeline()" disabled>
 Continue to Analysis <span class="material-symbols-outlined">arrow_forward</span>
 </button>
 </div>
 </div>
 
 <div id="validation-summary-container" style="margin-bottom: var(--space-6);">
 <!-- Summary populated by JS -->
 </div>
 
 <div id="validation-rules-container">
 <!-- Rules populated by JS -->
 </div>

 </div>
 </div>
 </main>
 <!-- END: Main Content Area -->

 <script type="module" src="js/validation.js"></script>
 <script type="module" src="js/shell.js"></script>
</body>
</html>
