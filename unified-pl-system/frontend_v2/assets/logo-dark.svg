<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Part (Scaled down and shifted to the left) -->
  <g transform="translate(10, 10) scale(0.4)">
    <!-- Infinity / Brain combo -->
    <path d="M 60 120 C 30 120, 30 80, 60 80 C 80 80, 100 120, 140 120 C 170 120, 170 80, 140 80 C 120 80, 100 120, 60 120 Z" fill="none" stroke="url(#brandGrad)" stroke-width="16" stroke-linecap="round"/>
    <!-- Brain folds / nodes -->
    <circle cx="60" cy="80" r="14" fill="url(#brandGrad)" />
    <circle cx="140" cy="80" r="14" fill="url(#brandGrad)" />
    <circle cx="100" cy="100" r="18" fill="url(#brandGrad)" />
    <!-- Tech lines -->
    <path d="M 60 80 L 100 60 L 140 80" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="60" r="8" fill="#F8FAFC"/>
  </g>

  <!-- Text Part -->
  <text x="110" y="55" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="28" fill="#F8FAFC" dominant-baseline="middle">Unified P&amp;L</text>
</svg>
