<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
 <meta content="width=device-width, initial-scale=1.0" name="viewport">
 <title>Settings - Unified P&L</title>
 <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
 <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
 <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
 <script>
 tailwind.config = {
 theme: {
 extend: {
 colors: {
 primary: '#5b5ceb',
 'primary-container': '#e5e6ff',
 'on-primary-container': '#1a1a4b',
 surface: '#f8f9fd',
 'surface-container-lowest': '#ffffff',
 'surface-container-low': '#f2f3f7',
 'on-surface': '#1a1c1e',
 'on-surface-variant': '#44474e',
 'outline-variant': '#c4c6d0',
 success: '#10b981',
 danger: '#ef4444',
 warning: '#f59e0b',
 },
 fontFamily: {
 sans: ['Inter', 'sans-serif'],
 },
 borderRadius: {
 'card': '20px',
 }
 }
 }
 }
 </script>
 <style data-purpose="custom-layout">
 body {
 background-color: #FAFBFF;
 font-family: 'Inter', sans-serif;
 }
 .custom-scrollbar::-webkit-scrollbar {
 width: 4px;
 }
 .custom-scrollbar::-webkit-scrollbar-thumb {
 background: #e2e8f0;
 border-radius: 10px;
 }
 .glass-effect {
 background: rgba(255, 255, 255, 0.8);
 backdrop-filter: blur(12px);
 }
 .sidebar-active {
 background-color: #e5e6ff;
 color: #5b5ceb;
 font-weight: 600;
 }
 .progress-ring-circle {
 transition: stroke-dashoffset 0.35s;
 transform: rotate(-90deg);
 transform-origin: 50% 50%;
 }
 </style>
</head>
<body class="text-on-surface transition-colors duration-300">
 <!-- Synchronous auth guard: prevents flash of unauthenticated content -->
 <script>
 (function() {
 var token = sessionStorage.getItem('pl_access_token') || localStorage.getItem('pl_access_token');
 if (!token) { window.location.replace('login.html'); }
 })();
 </script>


 <div id="sidebar-container"></div>


 <!-- BEGIN: Main Content Area -->
 <main class="ml-[280px] min-h-screen pb-16">
 <!-- BEGIN: Top Bar -->
 <header class="h-16 glass-effect border-b border-outline-variant/20 flex items-center justify-between px-8 sticky top-0 z-40">
 <div class="flex items-center gap-2">
 <span class="text-on-surface-variant text-sm">Home</span>
 <span class="material-symbols-outlined text-sm text-on-surface-variant">chevron_right</span>
 <span class="font-semibold text-sm">Dashboard</span>
 </div>
 <div class="flex-1 max-w-xl px-12">
 <div class="relative group">
 <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
 <input class="w-full bg-surface-container-low border-none rounded-full pl-10 pr-4 py-2 text-sm focus:ring-2 focus:ring-primary/20 transition-all" ="Search anything..." type="text">
 </div>
 </div>
 <div class="flex items-center gap-4">
 <button id="notifications-trigger" class="relative p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors">
 <span class="material-symbols-outlined">notifications</span>
 <span id="notifications-badge" class="absolute top-2 right-2 w-2 h-2 bg-danger rounded-full border-2 border-white" style="display:none"></span>
 </button>
 <button class="p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors">
 <span class="material-symbols-outlined">help</span>
 </button>
 </div>
 </header>
 <!-- END: Top Bar -->

 <div class="px-8 space-y-8 mt-8">
 

 <div class="px-8 mt-6 flex gap-8">
 
 <!-- Settings Navigation -->
 <div class="w-64 flex-shrink-0 space-y-1">
 <button class="w-full text-left px-4 py-3 rounded-lg text-sm font-semibold bg-primary/10 text-primary" onclick="switchTab('general', this)">General Preferences</button>
 <button class="w-full text-left px-4 py-3 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 :bg-slate-800" onclick="switchTab('api', this)">API & Integrations</button>
 <button class="w-full text-left px-4 py-3 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 :bg-slate-800" onclick="switchTab('security', this)">Security & Access</button>
 </div>

 <!-- Content -->
 <div class="flex-1 bg-white rounded-[20px] shadow-sm border border-slate-100 p-8">
 
 <!-- General Tab -->
 <div id="tab-general" class="space-y-8">
 <div>
 <h3 class="text-lg font-bold text-slate-900 mb-4 border-b border-slate-100 pb-2">Regional Settings</h3>
 <div class="grid grid-cols-2 gap-6">
 <div>
 <label class="block text-sm font-semibold text-slate-700 mb-2">Base Currency</label>
 <select id="currency-select" class="w-full p-2.5 rounded-lg border border-slate-200 bg-white text-sm focus:border-primary focus:ring-1 focus:ring-primary/20">
 <option value="INR">INR (₹)</option>
 <option value="USD">USD ($)</option>
 <option value="EUR">EUR (€)</option>
 <option value="GBP">GBP (£)</option>
 <option value="JPY">JPY (¥)</option>
 </select>
 </div>
 <div>
 <label class="block text-sm font-semibold text-slate-700 mb-2">Date Format</label>
 <select id="date-format-select" class="w-full p-2.5 rounded-lg border border-slate-200 bg-white text-sm focus:border-primary focus:ring-1 focus:ring-primary/20">
 <option>MM/DD/YYYY</option>
 <option>DD/MM/YYYY</option>
 <option>YYYY-MM-DD</option>
 </select>
 </div>
 </div>
 </div>
 

 
 <div class="flex justify-end pt-4 border-t border-slate-100 ">
 <button class="bg-primary text-white px-6 py-2 rounded-lg font-semibold" onclick="saveSettings()">Save Changes</button>
 </div>
 </div>

 <!-- API Tab -->
 <div id="tab-api" class="space-y-8 hidden">
 <div>
 <h3 class="text-lg font-bold text-slate-900 mb-4 border-b border-slate-100 pb-2">API Keys</h3>
 <p class="text-sm text-slate-500 mb-4">Manage API keys for external integrations and automated data ingestion.</p>
 
 <div class="space-y-4">
 <div class="flex items-center justify-between p-4 border border-slate-200 rounded-xl">
 <div>
 <p class="font-semibold text-slate-900 ">ERP Integration Key</p>
 <p class="text-xs text-slate-500 mt-1">Last used: 2 hours ago &bull; Expires: Never</p>
 </div>
 <div class="flex gap-2">
 <button class="text-slate-500 hover:text-slate-700 :text-white"><span class="material-symbols-outlined text-[20px]">content_copy</span></button>
 <button class="text-red-500 hover:text-red-700"><span class="material-symbols-outlined text-[20px]">delete</span></button>
 </div>
 </div>
 
 <button class="w-full py-3 border border-dashed border-slate-300 rounded-xl text-primary font-semibold hover:bg-primary/5">+ Generate New Key</button>
 </div>
 </div>
 </div>
 
 <!-- Security Tab -->
 <div id="tab-security" class="space-y-8 hidden">
 <div>
 <h3 class="text-lg font-bold text-slate-900 mb-4 border-b border-slate-100 pb-2">Two-Factor Authentication (2FA)</h3>
 <div class="flex items-center justify-between p-4 border border-slate-200 rounded-xl">
 <div>
 <p class="font-semibold text-slate-900 ">Authenticator App</p>
 <p class="text-xs text-slate-500">Require an authenticator app for login</p>
 </div>
 <button class="px-4 py-1.5 bg-slate-100 text-slate-700 font-semibold rounded-lg text-sm">Enable</button>
 </div>
 </div>
 </div>

 </div>
 </div>
 </div>
 </main>
 <!-- END: Main Content Area -->

 <script type="module" src="js/settings.js"></script>
 <script type="module" src="js/shell.js"></script>
</body>
</html>
